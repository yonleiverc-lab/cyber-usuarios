<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEURAL-LINK // Cybernetic Users</title>
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-pink: #ff0055;
            --neon-purple: #b026ff;
            --neon-green: #00ff66;
            --neon-yellow: #ffe600;
            --bg-dark: #030712;
            --panel-bg: rgba(10, 16, 35, 0.85);
            --font-tech: 'Courier New', Consolas, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: #a5b4fc;
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(176, 38, 255, 0.15), transparent 70%),
                linear-gradient(0deg, rgba(0, 0, 0, 0.9), rgba(3, 7, 18, 0.6));
        }

        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
            opacity: 0.4;
        }

        .scanline-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 99;
            pointer-events: none;
            opacity: 0.6;
        }

        header {
            background: rgba(3, 7, 18, 0.9);
            border-bottom: 2px solid var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .hud-top-bar {
            display: flex;
            justify-content: space-between;
            font-family: var(--font-tech);
            font-size: 0.75rem;
            color: var(--neon-cyan);
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
        }

        .header-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            font-family: var(--font-tech);
            font-size: 1.8rem;
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-glitch {
            color: var(--neon-pink);
            animation: glitch 1.5s infinite alternate;
        }

        .sys-status {
            background: rgba(0, 255, 102, 0.1);
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            padding: 10px 20px;
            font-family: var(--font-tech);
            display: flex;
            align-items: center;
            gap: 10px;
            clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%);
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1rem 5rem;
        }

        .grid-catalog {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .holo-card {
            background: var(--panel-bg);
            border: 1px solid rgba(0, 243, 255, 0.2);
            padding: 25px 18px 18px 18px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            clip-path: polygon(0 0, 92% 0, 100% 8%, 100% 100%, 8% 100%, 0 92%);
            transition: all 0.4s ease;
        }

        .holo-card::after {
            content: '';
            position: absolute;
            bottom: 0; right: 0; width: 15px; height: 15px;
            background: var(--neon-cyan);
            clip-path: polygon(100% 0, 100% 100%, 0 100%);
        }

        .holo-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.3);
        }

        .card-tag {
            position: absolute;
            top: 0;
            left: 0;
            background: var(--neon-cyan);
            color: #000;
            font-family: var(--font-tech);
            font-size: 0.75rem;
            font-weight: bold;
            padding: 3px 15px;
            letter-spacing: 1px;
            z-index: 2;
            clip-path: polygon(0 0, 90% 0, 100% 100%, 0 100%);
        }

        .user-name {
            font-size: 1.4rem;
            font-weight: 900;
            color: #fff;
            margin-bottom: 10px;
            margin-top: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }

        .user-data {
            font-family: var(--font-tech);
            color: var(--neon-green);
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        .user-company {
            font-family: var(--font-tech);
            color: var(--neon-purple);
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        .btn-buy {
            background: transparent;
            border: 1px solid var(--neon-pink);
            color: var(--neon-pink);
            padding: 10px 14px;
            font-family: var(--font-tech);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            clip-path: polygon(0 0, 95% 0, 100% 30%, 100% 100%, 0 100%);
            width: 100%;
            text-align: center;
            letter-spacing: 2px;
        }

        .btn-buy:hover {
            background: var(--neon-pink);
            color: #fff;
            font-weight: bold;
            box-shadow: 0 0 15px var(--neon-pink);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 7, 18, 0.9);
            backdrop-filter: blur(15px);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }

        .modal-box {
            background: var(--panel-bg);
            border: 2px solid var(--neon-purple);
            box-shadow: 0 0 40px rgba(176, 38, 255, 0.4);
            width: 92%;
            max-width: 800px;
            padding: 25px;
            position: relative;
            clip-path: polygon(0 0, 95% 0, 100% 5%, 100% 100%, 5% 100%, 0 95%);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--neon-purple);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            font-family: var(--font-tech);
            color: var(--neon-purple);
            font-size: 1.2rem;
            letter-spacing: 2px;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--neon-pink);
            font-size: 1.8rem;
            cursor: pointer;
        }

        .posts-list {
            max-height: 450px;
            overflow-y: auto;
            padding-right: 10px;
        }

        .post-item {
            background: rgba(0, 0, 0, 0.5);
            margin-bottom: 15px;
            /* LÍNEA PARA MODIFICAR EN CLASE: Cambia var(--neon-cyan) por var(--neon-green) o var(--neon-yellow) */
            border-left: 4px solid var(--neon-cyan);
            padding: 15px;
            font-family: 'Segoe UI', system-ui, sans-serif;
            transition: all 0.3s;
        }

        .post-item:hover {
            background: rgba(0, 243, 255, 0.05);
        }

        .post-title {
            color: var(--neon-cyan);
            font-family: var(--font-tech);
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .post-body {
            color: #a5b4fc;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .status-msg {
            grid-column: 1/-1;
            text-align: center;
            font-family: var(--font-tech);
            padding: 3rem;
            font-size: 1.5rem;
            letter-spacing: 2px;
        }

        .msg-loading { color: var(--neon-cyan); animation: pulse 1.5s infinite; }
        .msg-error { color: var(--neon-pink); text-shadow: 0 0 10px var(--neon-pink); }

        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        /* Estilo para el scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }
        ::-webkit-scrollbar-thumb { background: var(--neon-purple); border-radius: 4px; }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>
    <div class="scanline-overlay"></div>

    <header>
        <div class="hud-top-bar">
            <span>[ SYS_STATUS: ONLINE ]</span>
            <span id="timeDisplay">LOC_TIME: --:--:--</span>
            <span>[ SECURE_LINK: ENCRYPTED ]</span>
        </div>
        <div class="header-main">
            <div class="logo">
                ⚡ NEURAL<span class="logo-glitch">USERS</span>
            </div>
            <div class="sys-status">
                <span>🌐 API: JSONPlaceholder</span>
            </div>
        </div>
    </header>

    <main>
        <!-- Grilla donde aparecerán los usuarios -->
        <div class="grid-catalog" id="catalogGrid"></div>
    </main>

    <!-- MODAL DE PUBLICACIONES -->
    <div class="modal-overlay" id="postModal">
        <div class="modal-box">
            <div class="modal-header">
                <h2 id="modalTitle">// EXTRAYENDO DATOS...</h2>
                <button class="close-btn" onclick="cerrarModal()">&times;</button>
            </div>
            <div class="posts-list" id="postItems"></div>
        </div>
    </div>

    <script>
        // --- SONIDOS ---
        function playBeep(freq = 800, type = 'sine', duration = 0.05) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.05, ctx.currentTime);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + duration);
            } catch(e){}
        }

        const grid = document.getElementById('catalogGrid');
        const modal = document.getElementById('postModal');
        const postsContainer = document.getElementById('postItems');
        const modalTitle = document.getElementById('modalTitle');

        // --- 1. OBTENER Y MOSTRAR USUARIOS ---
        async function fetchUsuarios() {
            // Mostrar mensaje de carga (cyberpunk style)
            grid.innerHTML = `<div class="status-msg msg-loading">[ ESTABLECIENDO CONEXIÓN CON LA RED... ]</div>`;
            
            try {
                const respuesta = await fetch('https://jsonplaceholder.typicode.com/users');
                if (!respuesta.ok) throw new Error('Fallo en la red');
                
                const usuarios = await respuesta.json();
                grid.innerHTML = ''; 

                usuarios.forEach(usuario => {
                    const card = document.createElement('div');
                    card.className = 'holo-card';
                    card.innerHTML = `
                        <span class="card-tag">// UID-${usuario.id}</span>
                        <div>
                            <div class="user-name">${usuario.name}</div>
                            <div class="user-data">> CORREO: ${usuario.email}</div>
                            <div class="user-company">> CORP: ${usuario.company.name}</div>
                        </div>
                        <div style="margin-top: 15px;">
                            <button class="btn-buy" onclick="abrirPublicaciones(${usuario.id}, '${usuario.name}')">
                                [ HACKEAR DATOS ]
                            </button>
                        </div>
                    `;
                    grid.appendChild(card);
                });

            } catch (error) {
                console.error(error);
                grid.innerHTML = `<div class="status-msg msg-error">[ ERROR CRÍTICO: CONEXIÓN AL SERVIDOR PERDIDA ]</div>`;
            }
        }

        // --- 2. OBTENER PUBLICACIONES DE UN USUARIO ---
        async function abrirPublicaciones(userId, userName) {
            playBeep(900, 'sine');
            modal.style.display = 'flex';
            modalTitle.innerText = `// REGISTROS DE: ${userName.toUpperCase()}`;
            postsContainer.innerHTML = `<div class="status-msg msg-loading" style="font-size: 1rem;">[ DECODIFICANDO TRANSMISIONES... ]</div>`;

            try {
                const respuesta = await fetch(`https://jsonplaceholder.typicode.com/posts?userId=${userId}`);
                if (!respuesta.ok) throw new Error('Error de red');
                
                const publicaciones = await respuesta.json();
                postsContainer.innerHTML = '';
                
                if (publicaciones.length === 0) {
                    postsContainer.innerHTML = `<div style="color:#64748b; font-family:var(--font-tech); text-align:center;">[ NO HAY DATOS REGISTRADOS ]</div>`;
                    return;
                }

                publicaciones.forEach(post => {
                    const item = document.createElement('div');
                    item.className = 'post-item';
                    item.innerHTML = `
                        <div class="post-title">> ${post.title}</div>
                        <div class="post-body">${post.body}</div>
                    `;
                    postsContainer.appendChild(item);
                });

            } catch (error) {
                console.error(error);
                postsContainer.innerHTML = `<div class="status-msg msg-error" style="font-size: 1rem;">[ ERROR DE INTERFAZ: NO SE PUDO DESENCRIPTAR ]</div>`;
            }
        }

        function cerrarModal() {
            playBeep(400, 'triangle', 0.05);
            modal.style.display = 'none';
        }

        // --- CANVAS Y RELOJ ---
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let particles = Array.from({length: 40}, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            speed: 0.5 + Math.random() * 1.5,
            size: 1 + Math.random() * 2
        }));

        function drawBg() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00f3ff';
            particles.forEach(p => {
                p.y -= p.speed;
                if (p.y < 0) p.y = canvas.height;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            });
            requestAnimationFrame(drawBg);
        }
        drawBg();

        setInterval(() => {
            const now = new Date();
            document.getElementById('timeDisplay').innerText = `LOC_TIME: ${now.toTimeString().split(' ')[0]}`;
        }, 1000);

        // INICIAR CARGA DE USUARIOS
        fetchUsuarios();
    </script>
</body>
</html>
